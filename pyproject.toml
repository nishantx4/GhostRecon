[project]
name = "ghostrecon"
version = "3.0.0"
description = "AI-Powered Bug Bounty Hunter CLI — Recon, Scan, Verify, Report"
authors = [{name = "Nishant"}]
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "textual>=1.0",
    "rich>=13.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyjwt>=2.8",
    "dnspython>=2.6",
    "aiofiles>=24.1",
    "pyyaml>=6.0",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
full = [
    "playwright>=1.40",
    "wfuzz>=3.1",
]

[project.scripts]
ghostrecon = "ghostrecon:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
